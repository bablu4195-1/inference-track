services:
  # Prefill worker: compute-bound, ingests prompts, ships KV to decode worker.
  prefill:
    image: vllm/vllm-openai:latest
    container_name: vllm-prefill
    runtime: nvidia
    ipc: host
    ports:
      - "8001:8000"
    networks:
      disagg:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_CACHE: /root/.cache/huggingface
      # NIXL side-channel must be routable: each worker advertises its own
      # bridge IP (P10 lesson 2026-09-20: 127.0.0.1 makes decode dial itself
      # -> "Remote NIXL agent engine ID mismatch").
      VLLM_NIXL_SIDE_CHANNEL_HOST: 172.28.0.10
      VLLM_NIXL_SIDE_CHANNEL_PORT: 5600
      UCX_NET_DEVICES: all
    volumes:
      - /mnt/hf:/root/.cache/huggingface
    command:
      - "--model=Qwen/Qwen2.5-7B-Instruct"
      - "--host=0.0.0.0"
      - "--port=8000"
      - "--dtype=auto"
      - "--gpu-memory-utilization=0.9"
      - "--max-model-len=8192"
      - "--max-num-batched-tokens=8192"
      - "--trust-remote-code"
      # Roles (0.29): kv_producer / kv_consumer. kv_both is deprecated for
      # NixlConnector and never handshakes (P10 lesson 2026-09-20). A proxy
      # (disagg_proxy_multiturn.py, :8000) fronts both workers and passes
      # kv_transfer_params prefill -> decode.
      - "--kv-transfer-config={\"kv_connector\":\"NixlConnector\",\"kv_role\":\"kv_producer\",\"kv_ip\":\"172.28.0.10\",\"kv_port\":5600}"

  # Decode worker: memory-bound, receives KV, streams tokens.
  decode:
    image: vllm/vllm-openai:latest
    container_name: vllm-decode
    runtime: nvidia
    ipc: host
    ports:
      - "8002:8000"
    networks:
      disagg:
        ipv4_address: 172.28.0.11
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_CACHE: /root/.cache/huggingface
      VLLM_NIXL_SIDE_CHANNEL_HOST: 172.28.0.11
      VLLM_NIXL_SIDE_CHANNEL_PORT: 5601
      UCX_NET_DEVICES: all
    volumes:
      - /mnt/hf:/root/.cache/huggingface
    command:
      - "--model=Qwen/Qwen2.5-7B-Instruct"
      - "--host=0.0.0.0"
      - "--port=8000"
      - "--dtype=auto"
      - "--gpu-memory-utilization=0.9"
      - "--max-model-len=8192"
      - "--max-num-batched-tokens=512"
      - "--trust-remote-code"
      - "--kv-transfer-config={\"kv_connector\":\"NixlConnector\",\"kv_role\":\"kv_consumer\",\"kv_ip\":\"172.28.0.11\",\"kv_port\":5601}"
    depends_on:
      prefill:
        condition: service_healthy

networks:
  disagg:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
